{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - WebVitas AI</title>
    <link rel="stylesheet" href="{% static 'dashboard/pages/login.css' %}">
    {% include 'dashboard/includes/theme_head.html' %}
</head>
<body data-page="login" data-layout="auth">
    {% include 'dashboard/includes/auth_brand_panel.html' %}
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <a class="wv-brand" href="/dashboard/" aria-label="WebVitas AI — لوحة التحكم"><img src="{% static 'dashboard/webvitas-mark.svg' %}" alt="" width="36" height="26"><span>webvitas<small>AI</small></span></a>
                <h1>أهلاً برجوعك.</h1>
                <p>سجل دخولك للوحة التحكم</p>
            </div>

            <div class="error-msg" id="error-msg"></div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" autocomplete="email" dir="ltr" id="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" autocomplete="current-password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary" id="btn-login">
                    <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                </button>
            </form>

            <div class="auth-footer">
                <a href="/dashboard/forgot-password/" style="display:block;margin-bottom:10px;">نسيت كلمة المرور؟</a>
                مالكش حساب؟ <a href="/dashboard/register/">سجل حساب جديد</a>
            </div>
        </div>
    </div>

    <script>
        // If already logged in, redirect
        if (localStorage.getItem('access_token')) {
            window.location.href = '/dashboard/';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errorDiv = document.getElementById('error-msg');
            errorDiv.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الدخول...';

            try {
                const res = await fetch('/dashboard/api/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                localStorage.setItem('access_token', data.access);
                localStorage.setItem('refresh_token', data.refresh);
                localStorage.setItem('store_name', data.store.name);
                window.location.href = '/dashboard/';
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
            }
        }
    </script>
</body>
</html>
