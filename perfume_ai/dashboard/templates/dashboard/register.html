{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - WebVitas AI</title>
    <link rel="stylesheet" href="{% static 'dashboard/pages/register.css' %}">
    {% include 'dashboard/includes/theme_head.html' %}
</head>
<body data-page="register" data-layout="auth">
    {% include 'dashboard/includes/auth_brand_panel.html' %}
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <a class="wv-brand" href="/dashboard/" aria-label="WebVitas AI — لوحة التحكم"><img src="{% static 'dashboard/webvitas-mark.svg' %}" alt="" width="36" height="26"><span>webvitas<small>AI</small></span></a>
                <h1>ابدأ حكاية متجرك.</h1>
                <p>سجل متجرك وابدأ البيع بالذكاء الاصطناعي</p>
            </div>

            <div class="error-msg" id="error-msg"></div>
            <div class="success-msg" id="success-msg"></div>

            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="full_name">الاسم الكامل</label>
                    <input type="text" id="full_name" autocomplete="name" placeholder="محمد أحمد" required>
                </div>

                <div class="form-group">
                    <label for="store_name">اسم المتجر</label>
                    <input type="text" id="store_name" autocomplete="organization" placeholder="عطور الأصيل" required>
                </div>

                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" autocomplete="email" dir="ltr" id="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور (8 أحرف على الأقل)</label>
                    <input type="password" autocomplete="new-password" id="password" placeholder="••••••••" minlength="8" required>
                </div>

                <button type="submit" class="btn-primary" id="btn-register">
                    <i class="fas fa-user-plus"></i> إنشاء الحساب
                </button>
            </form>

            <div class="auth-footer">
                عندك حساب بالفعل؟ <a href="/dashboard/login/">سجل دخولك</a>
            </div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('access_token')) {
            window.location.href = '/dashboard/';
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-register');
            const errorDiv = document.getElementById('error-msg');
            const successDiv = document.getElementById('success-msg');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التسجيل...';

            try {
                const res = await fetch('/dashboard/api/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name: document.getElementById('full_name').value,
                        store_name: document.getElementById('store_name').value,
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Registration failed');
                }

                localStorage.setItem('access_token', data.access);
                localStorage.setItem('refresh_token', data.refresh);
                localStorage.setItem('store_name', data.store.name);

                successDiv.textContent = ' تم إنشاء الحساب! جاري تحويلك...';
                successDiv.style.display = 'block';

                setTimeout(() => {
                    window.location.href = '/dashboard/';
                }, 1000);
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> إنشاء الحساب';
            }
        }
    </script>
</body>
</html>
