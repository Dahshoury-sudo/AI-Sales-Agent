{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيت كلمة المرور - WebVitas AI</title>
    <link rel="stylesheet" href="{% static 'dashboard/pages/forgot_password.css' %}">
    {% include 'dashboard/includes/theme_head.html' %}
</head>
<body data-page="forgot_password" data-layout="auth">
    {% include 'dashboard/includes/auth_brand_panel.html' %}
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <a class="wv-brand" href="/dashboard/" aria-label="WebVitas AI — لوحة التحكم"><img src="{% static 'dashboard/webvitas-mark.svg' %}" alt="" width="36" height="26"><span>webvitas<small>AI</small></span></a>
                <h1>نسيت كلمة المرور؟</h1>
                <p>ادخل إيميلك وهنبعتلك رابط لإعادة التعيين</p>
            </div>

            <div class="error-msg" id="error-msg"></div>
            <div class="success-msg" id="success-msg"></div>

            <form id="forgot-form" onsubmit="handleForgot(event)">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" autocomplete="email" dir="ltr" id="email" placeholder="example@email.com" required>
                </div>

                <button type="submit" class="btn-primary" id="btn-forgot">
                    <i class="fas fa-paper-plane"></i> إرسال رابط التعيين
                </button>
            </form>

            <div class="auth-footer">
                <a href="/dashboard/login/">رجوع لتسجيل الدخول</a>
            </div>
        </div>
    </div>

    <script>
        async function handleForgot(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-forgot');
            const errorDiv = document.getElementById('error-msg');
            const successDiv = document.getElementById('success-msg');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';

            try {
                const res = await fetch('/dashboard/api/forgot-password/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value })
                });

                const data = await res.json();
                successDiv.textContent = data.message;
                successDiv.style.display = 'block';
            } catch (err) {
                errorDiv.textContent = 'حصل خطأ. حاول تاني.';
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال رابط التعيين';
            }
        }
    </script>
</body>
</html>
