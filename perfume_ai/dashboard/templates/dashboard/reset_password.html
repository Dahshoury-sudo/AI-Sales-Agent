{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور - WebVitas AI</title>
    <link rel="stylesheet" href="{% static 'dashboard/pages/reset_password.css' %}">
    {% include 'dashboard/includes/theme_head.html' %}
</head>
<body data-page="reset_password" data-layout="auth">
    {% include 'dashboard/includes/auth_brand_panel.html' %}
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <a class="wv-brand" href="/dashboard/" aria-label="WebVitas AI — لوحة التحكم"><img src="{% static 'dashboard/webvitas-mark.svg' %}" alt="" width="36" height="26"><span>webvitas<small>AI</small></span></a>
                <h1>كلمة مرور جديدة.</h1>
                <p>ادخل كلمة المرور الجديدة</p>
            </div>

            <div class="error-msg" id="error-msg"></div>
            <div class="success-msg" id="success-msg"></div>

            <form id="reset-form" onsubmit="handleReset(event)">
                <div class="form-group">
                    <label for="password">كلمة المرور الجديدة (8 أحرف على الأقل)</label>
                    <input type="password" autocomplete="new-password" id="password" placeholder="••••••••" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="password2">تأكيد كلمة المرور</label>
                    <input type="password" autocomplete="new-password" id="password2" placeholder="••••••••" minlength="8" required>
                </div>

                <button type="submit" class="btn-primary" id="btn-reset">
                    <i class="fas fa-check-circle"></i> تغيير كلمة المرور
                </button>
            </form>

            <div class="auth-footer">
                <a href="/dashboard/login/">رجوع لتسجيل الدخول</a>
            </div>
        </div>
    </div>

    <script>
        async function handleReset(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-reset');
            const errorDiv = document.getElementById('error-msg');
            const successDiv = document.getElementById('success-msg');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;

            if (password !== password2) {
                errorDiv.textContent = 'كلمتين المرور مش متطابقين!';
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التغيير...';

            // Extract uidb64 and token from the URL path
            // URL format: /dashboard/reset-password/<uidb64>/<token>/
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            const uidb64 = pathParts[pathParts.length - 2];
            const token = pathParts[pathParts.length - 1];

            try {
                const res = await fetch(`/dashboard/api/reset-password/${uidb64}/${token}/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Reset failed');
                }

                successDiv.textContent = data.message;
                successDiv.style.display = 'block';
                document.getElementById('reset-form').style.display = 'none';

                setTimeout(() => { window.location.href = '/dashboard/login/'; }, 2000);
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle"></i> تغيير كلمة المرور';
            }
        }
    </script>
</body>
</html>
