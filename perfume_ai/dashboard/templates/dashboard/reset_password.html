<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور - Perfume AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container { width: 100%; max-width: 440px; padding: 20px; }
        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }
        .auth-logo { text-align: center; margin-bottom: 30px; }
        .auth-logo i {
            font-size: 3rem;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-logo h1 { font-size: 1.8rem; margin-top: 10px; font-weight: 700; }
        .auth-logo p { color: var(--text-muted); margin-top: 5px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-muted); font-size: 0.9rem; }
        .form-group input {
            width: 100%; padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px; color: white;
            font-family: inherit; font-size: 1rem;
            outline: none; transition: border-color 0.3s;
        }
        .form-group input:focus { border-color: var(--primary); }
        .btn-primary {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white; border: none; border-radius: 12px;
            font-family: inherit; font-size: 1.1rem; font-weight: 700;
            cursor: pointer; transition: all 0.3s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error-msg {
            background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5; padding: 12px; border-radius: 10px;
            margin-bottom: 20px; display: none; text-align: center;
        }
        .success-msg {
            background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac; padding: 12px; border-radius: 10px;
            margin-bottom: 20px; display: none; text-align: center;
        }
        .auth-footer { text-align: center; margin-top: 20px; color: var(--text-muted); }
        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fas fa-key"></i>
                <h1>كلمة مرور جديدة</h1>
                <p>ادخل كلمة المرور الجديدة</p>
            </div>

            <div class="error-msg" id="error-msg"></div>
            <div class="success-msg" id="success-msg"></div>

            <form id="reset-form" onsubmit="handleReset(event)">
                <div class="form-group">
                    <label for="password">كلمة المرور الجديدة (8 أحرف على الأقل)</label>
                    <input type="password" id="password" placeholder="••••••••" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="password2">تأكيد كلمة المرور</label>
                    <input type="password" id="password2" placeholder="••••••••" minlength="8" required>
                </div>

                <button type="submit" class="btn-primary" id="btn-reset">
                    <i class="fas fa-check-circle"></i> تغيير كلمة المرور
                </button>
            </form>

            <div class="auth-footer">
                <a href="/dashboard/login/">رجوع لتسجيل الدخول</a>
            </div>
        </div>
    </div>

    <script>
        async function handleReset(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-reset');
            const errorDiv = document.getElementById('error-msg');
            const successDiv = document.getElementById('success-msg');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;

            if (password !== password2) {
                errorDiv.textContent = 'كلمتين المرور مش متطابقين!';
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التغيير...';

            // Extract uidb64 and token from the URL path
            // URL format: /dashboard/reset-password/<uidb64>/<token>/
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            const uidb64 = pathParts[pathParts.length - 2];
            const token = pathParts[pathParts.length - 1];

            try {
                const res = await fetch(`/dashboard/api/reset-password/${uidb64}/${token}/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Reset failed');
                }

                successDiv.textContent = data.message;
                successDiv.style.display = 'block';
                document.getElementById('reset-form').style.display = 'none';

                setTimeout(() => { window.location.href = '/dashboard/login/'; }, 2000);
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle"></i> تغيير كلمة المرور';
            }
        }
    </script>
</body>
</html>
