<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الطلبات - Orders Dashboard</title>
    <meta name="description" content="لوحة تحكم الطلبات لأصحاب المتاجر - عرض وإدارة جميع الأوردرات">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-bg-hover: rgba(30, 41, 59, 0.9);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-light: rgba(255, 255, 255, 0.15);
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --primary-glow: rgba(139, 92, 246, 0.3);
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.15);
            --warning: #f59e0b;
            --warning-bg: rgba(245, 158, 11, 0.15);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --info: #38bdf8;
            --info-bg: rgba(56, 189, 248, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', 'Outfit', sans-serif;
            background: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(139, 92, 246, 0.05) 0px, transparent 70%);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* ═══ Login Screen ═══ */
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            animation: fadeInUp 0.6s ease;
        }

        .login-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--primary), #6d28d9);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 32px;
            box-shadow: 0 8px 32px var(--primary-glow);
        }

        .login-card h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .login-card p {
            color: var(--text-muted);
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 20px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border-light);
            border-radius: 14px;
            color: var(--text-main);
            font-family: 'Outfit', monospace;
            font-size: 0.95rem;
            direction: ltr;
            text-align: center;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .input-group input::placeholder {
            color: var(--text-dim);
            letter-spacing: 0;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), #6d28d9);
            border: none;
            border-radius: 14px;
            color: white;
            font-family: 'Tajawal', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px var(--primary-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--primary-glow);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .login-error {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
        }

        /* Back link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--primary); }

        /* ═══ Dashboard ═══ */
        #dashboard {
            display: none;
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeInUp 0.5s ease;
        }

        /* Header */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .dashboard-header .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), #6d28d9);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 16px var(--primary-glow);
        }

        .brand h1 {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .brand .store-name {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .btn-logout {
            padding: 10px 20px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            color: var(--danger);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        /* Stats Cards */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 22px 24px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--glass-border-light);
            transform: translateY(-2px);
        }

        .stat-card .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
        }

        .stat-card .stat-icon {
            float: left;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            padding: 8px 18px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-muted);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .filter-btn:hover {
            border-color: var(--glass-border-light);
            color: var(--text-main);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--primary), #6d28d9);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 2px 12px var(--primary-glow);
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 8px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-main);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        .search-input::placeholder {
            color: var(--text-dim);
        }

        /* Orders Table */
        .orders-container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
        }

        .orders-table thead th {
            padding: 16px 20px;
            text-align: right;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.3);
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .orders-table tbody tr {
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .orders-table tbody tr:hover {
            background: rgba(139, 92, 246, 0.06);
        }

        .orders-table tbody td {
            padding: 16px 20px;
            font-size: 0.92rem;
            vertical-align: middle;
        }

        .order-id {
            font-family: 'Outfit', monospace;
            font-weight: 600;
            color: var(--primary);
        }

        .customer-name {
            font-weight: 600;
        }

        .customer-phone {
            font-family: 'Outfit', monospace;
            color: var(--text-muted);
            font-size: 0.85rem;
            direction: ltr;
            display: inline-block;
        }

        .order-total {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            color: var(--success);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .status-pending {
            background: var(--warning-bg);
            color: var(--warning);
        }

        .status-confirmed {
            background: var(--info-bg);
            color: var(--info);
        }

        .status-delivered {
            background: var(--success-bg);
            color: var(--success);
        }

        .status-cancelled {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .order-date {
            color: var(--text-muted);
            font-size: 0.82rem;
            font-family: 'Outfit', sans-serif;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state .emoji {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        /* ═══ Order Detail Modal ═══ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border-light);
            border-radius: 24px;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 28px 16px;
            border-bottom: 1px solid var(--glass-border);
        }

        .modal-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: transparent;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .modal-body {
            padding: 24px 28px;
        }

        .detail-section {
            margin-bottom: 24px;
        }

        .detail-section h3 {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .detail-value {
            font-weight: 600;
            font-size: 0.92rem;
        }

        .detail-value.phone {
            font-family: 'Outfit', monospace;
            direction: ltr;
        }

        .detail-value.price {
            color: var(--success);
            font-family: 'Outfit', sans-serif;
        }

        /* Product Items in Modal */
        .product-item {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-item .product-name {
            font-weight: 600;
            font-size: 0.92rem;
        }

        .product-item .product-meta {
            color: var(--text-muted);
            font-size: 0.82rem;
            margin-top: 4px;
        }

        .product-item .product-price {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            color: var(--success);
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .order-address {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 14px 18px;
            color: var(--text-main);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .bot-notes {
            background: rgba(139, 92, 246, 0.08);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 14px;
            padding: 14px 18px;
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.6;
        }

        /* Status change buttons */
        .status-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .btn-status {
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-status:hover {
            transform: translateY(-1px);
        }

        .btn-confirm {
            background: var(--info-bg);
            border-color: rgba(56, 189, 248, 0.3);
            color: var(--info);
        }

        .btn-deliver {
            background: var(--success-bg);
            border-color: rgba(16, 185, 129, 0.3);
            color: var(--success);
        }

        .btn-cancel {
            background: var(--danger-bg);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--danger);
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .loading-row td {
            text-align: center;
            padding: 40px !important;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.3); border-radius: 3px; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive — Laptop (small screens ≤ 1366px) */
        @media (max-width: 1366px) {
            #dashboard { padding: 20px; }
            .stat-card { padding: 16px 18px; }
            .stat-card .stat-value { font-size: 1.7rem; }
            .orders-table thead th { padding: 12px 14px; font-size: 0.74rem; }
            .orders-table tbody td { padding: 12px 14px; font-size: 0.88rem; }
            .modal { max-width: 560px; }
        }

        /* Responsive — Small laptop / large tablet (≤ 1024px) */
        @media (max-width: 1024px) {
            #dashboard { padding: 16px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .stat-card .stat-value { font-size: 1.5rem; }
            .dashboard-header h1 { font-size: 1.2rem; }
            .filter-bar { gap: 8px; }
            .filter-btn { padding: 6px 14px; font-size: 0.82rem; }
            .search-input { min-width: 150px; }
            .orders-table thead th { padding: 10px 12px; }
            .orders-table tbody td { padding: 10px 12px; font-size: 0.85rem; }
            .modal { max-width: 500px; }
            .modal-header { padding: 18px 22px 14px; }
            .modal-body { padding: 18px 22px; }
        }

        /* Responsive — Mobile (≤ 768px) */
        @media (max-width: 768px) {
            #dashboard { padding: 16px; }
            .dashboard-header { flex-direction: column; align-items: flex-start; }
            .stats-row { grid-template-columns: 1fr 1fr; }
            .orders-table thead { display: none; }
            .orders-table tbody tr {
                display: flex;
                flex-direction: column;
                padding: 16px 20px;
                border-bottom: 1px solid var(--glass-border);
            }
            .orders-table tbody td {
                padding: 4px 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .orders-table tbody td::before {
                content: attr(data-label);
                font-size: 0.75rem;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            .stat-card .stat-value { font-size: 1.5rem; }
            .modal { max-width: 95%; border-radius: 18px; }
            .modal-header { padding: 16px 18px 12px; }
            .modal-body { padding: 16px 18px; }
            .filter-bar { gap: 6px; }
            .filter-btn { padding: 6px 12px; font-size: 0.8rem; }
        }

        /* Responsive — Small mobile (≤ 480px) */
        @media (max-width: 480px) {
            .stats-row { grid-template-columns: 1fr; }
            .stat-card .stat-value { font-size: 1.3rem; }
            .login-card { padding: 32px 24px; }
        }
    </style>
</head>
<body>

<!-- ═══ Login Screen ═══ -->
<div id="login-screen">
    <div class="login-card">
        <a href="/" class="back-link" style="justify-content: center; width: 100%;">→ الرجوع للصفحة الرئيسية</a>
        <div class="login-icon">📦</div>
        <h1>لوحة الطلبات</h1>
        <p>ادخل مفتاح API الخاص بمتجرك لعرض الطلبات</p>
        <form id="login-form">
            <div class="input-group">
                <input type="text" id="api-key-input" placeholder="أدخل API Key الخاص بالمتجر" autocomplete="off">
            </div>
            <button type="submit" class="btn-primary" id="login-btn">دخول</button>
        </form>
        <p class="login-error" id="login-error">مفتاح API غير صحيح أو غير نشط</p>
    </div>
</div>

<!-- ═══ Dashboard ═══ -->
<div id="dashboard">
    <a href="/" class="back-link">→ الرجوع للصفحة الرئيسية</a>
    <div class="dashboard-header">
        <div class="brand">
            <div class="brand-icon">📦</div>
            <div>
                <h1>لوحة الطلبات</h1>
                <div class="store-name" id="store-name-display"></div>
            </div>
        </div>
        <button class="btn-logout" id="btn-logout" onclick="logout()">🚪 تسجيل خروج</button>
        <span id="orders-last-updated" style="font-size:0.78rem; color:rgba(255,255,255,0.35); margin-right:10px;"></span>
    </div>

    <!-- Stats -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-icon" style="background: var(--primary-glow);">📊</div>
            <div class="stat-label">إجمالي الطلبات</div>
            <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background: var(--warning-bg);">⏳</div>
            <div class="stat-label">قيد الانتظار</div>
            <div class="stat-value" id="stat-pending" style="color: var(--warning);">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background: var(--success-bg);">✅</div>
            <div class="stat-label">تم التوصيل</div>
            <div class="stat-value" id="stat-delivered" style="color: var(--success);">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background: var(--danger-bg);">❌</div>
            <div class="stat-label">ملغي</div>
            <div class="stat-value" id="stat-cancelled" style="color: var(--danger);">0</div>
        </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">الكل</button>
        <button class="filter-btn" data-filter="pending" onclick="setFilter('pending', this)">⏳ قيد الانتظار</button>
        <button class="filter-btn" data-filter="confirmed" onclick="setFilter('confirmed', this)">📋 مؤكد</button>
        <button class="filter-btn" data-filter="delivered" onclick="setFilter('delivered', this)">✅ تم التوصيل</button>
        <button class="filter-btn" data-filter="cancelled" onclick="setFilter('cancelled', this)">❌ ملغي</button>
        <input type="text" class="search-input" id="search-input" placeholder="🔍 بحث بالاسم أو رقم الهاتف..." oninput="filterOrders()">
    </div>

    <!-- Orders Table -->
    <div class="orders-container">
        <table class="orders-table">
            <thead>
                <tr>
                    <th>رقم الطلب</th>
                    <th>العميل</th>
                    <th>الهاتف</th>
                    <th>المنتجات</th>
                    <th>الإجمالي</th>
                    <th>الحالة</th>
                    <th>التاريخ</th>
                </tr>
            </thead>
            <tbody id="orders-body">
                <tr class="loading-row">
                    <td colspan="7"><div class="spinner"></div></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ═══ Order Detail Modal ═══ -->
<div class="modal-overlay" id="order-modal">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modal-title">تفاصيل الطلب</h2>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body" id="modal-body">
        </div>
    </div>
</div>

<script>
    let API_KEY = '';
    let STORE_NAME = '';
    let ALL_ORDERS = [];
    let currentFilter = 'all';

    // Auto-load API key
    const savedApiKey = localStorage.getItem('perfumeApiKey');
    if (savedApiKey) {
        document.getElementById('api-key-input').value = savedApiKey;
        setTimeout(() => document.getElementById('login-btn').click(), 100);
    }

    // ═══ Login ═══
    document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const key = document.getElementById('api-key-input').value.trim();
        if (!key) return;

        localStorage.setItem('perfumeApiKey', key);

        const loginBtn = document.getElementById('login-btn');
        loginBtn.textContent = 'جاري التحقق...';
        loginBtn.disabled = true;

        try {
            const res = await fetch('/api/orders/dashboard/', {
                headers: { 'X-API-Key': key }
            });

            if (res.ok) {
                const data = await res.json();
                API_KEY = key;
                STORE_NAME = data.store_name;
                ALL_ORDERS = data.orders;

                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('store-name-display').textContent = STORE_NAME;

                renderStats();
                renderOrders(ALL_ORDERS);
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        } catch (err) {
            document.getElementById('login-error').style.display = 'block';
        }

        loginBtn.textContent = 'دخول';
        loginBtn.disabled = false;
    });

    function logout() {
        API_KEY = '';
        ALL_ORDERS = [];
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('api-key-input').value = '';
        document.getElementById('login-error').style.display = 'none';
    }

    // ═══ Stats ═══
    function renderStats() {
        document.getElementById('stat-total').textContent = ALL_ORDERS.length;
        document.getElementById('stat-pending').textContent = ALL_ORDERS.filter(o => o.status === 'pending').length;
        document.getElementById('stat-delivered').textContent = ALL_ORDERS.filter(o => o.status === 'delivered').length;
        document.getElementById('stat-cancelled').textContent = ALL_ORDERS.filter(o => o.status === 'cancelled').length;
    }

    // ═══ Filters ═══
    function setFilter(filter, btn) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterOrders();
    }

    function filterOrders() {
        const search = document.getElementById('search-input').value.trim().toLowerCase();
        let filtered = ALL_ORDERS;

        if (currentFilter !== 'all') {
            filtered = filtered.filter(o => o.status === currentFilter);
        }

        if (search) {
            filtered = filtered.filter(o =>
                o.customer_name.toLowerCase().includes(search) ||
                o.customer_phone.includes(search) ||
                o.id.toString().includes(search)
            );
        }

        renderOrders(filtered);
    }

    // ═══ Render Orders ═══
    function renderOrders(orders) {
        const tbody = document.getElementById('orders-body');

        if (orders.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="7">
                        <div class="empty-state">
                            <div class="emoji">📭</div>
                            <h3>مفيش طلبات</h3>
                            <p>مفيش طلبات تطابق البحث أو الفلتر</p>
                        </div>
                    </td>
                </tr>
            `;
            return;
        }

        tbody.innerHTML = orders.map(order => {
            const statusAr = { pending: 'قيد الانتظار', confirmed: 'مؤكد', delivered: 'تم التوصيل', cancelled: 'ملغي' };
            const productsSummary = order.items.map(i => i.product_name).join('، ');
            const shortProducts = productsSummary.length > 30 ? productsSummary.substring(0, 30) + '...' : productsSummary;
            const date = new Date(order.created_at);
            const dateStr = date.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short', year: 'numeric' });
            const timeStr = date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

            return `
                <tr onclick="openModal(${order.id})">
                    <td data-label="رقم الطلب"><span class="order-id">#${order.id}</span></td>
                    <td data-label="العميل"><span class="customer-name">${order.customer_name}</span></td>
                    <td data-label="الهاتف"><span class="customer-phone">${order.customer_phone}${order.secondary_phone ? '<br><small style="color:var(--text-dim)">' + order.secondary_phone + '</small>' : ''}</span></td>
                    <td data-label="المنتجات" title="${productsSummary}">${shortProducts || '—'}</td>
                    <td data-label="الإجمالي"><span class="order-total">${parseFloat(order.total_price).toLocaleString()} EGP</span></td>
                    <td data-label="الحالة"><span class="status-badge status-${order.status}">${statusAr[order.status] || order.status}</span></td>
                    <td data-label="التاريخ"><span class="order-date">${dateStr} - ${timeStr}</span></td>
                </tr>
            `;
        }).join('');
    }

    // ═══ Modal ═══
    function openModal(orderId) {
        const order = ALL_ORDERS.find(o => o.id === orderId);
        if (!order) return;

        const statusAr = { pending: 'قيد الانتظار', confirmed: 'مؤكد', delivered: 'تم التوصيل', cancelled: 'ملغي' };
        const date = new Date(order.created_at);
        const dateStr = date.toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' });
        const timeStr = date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

        document.getElementById('modal-title').textContent = `طلب #${order.id}`;

        let itemsHtml = order.items.map(item => `
            <div class="product-item">
                <div>
                    <div class="product-name">${item.product_name}</div>
                    <div class="product-meta">${item.volume}ml × ${item.quantity}</div>
                </div>
                <div class="product-price">${parseFloat(item.line_total).toLocaleString()} EGP</div>
            </div>
        `).join('');

        let statusButtons = '';
        if (order.status === 'pending') {
            statusButtons = `
                <div class="status-actions">
                    <button class="btn-status btn-confirm" onclick="changeStatus(${order.id}, 'confirmed')">📋 تأكيد الطلب</button>
                    <button class="btn-status btn-deliver" onclick="changeStatus(${order.id}, 'delivered')">✅ تم التوصيل</button>
                    <button class="btn-status btn-cancel" onclick="changeStatus(${order.id}, 'cancelled')">❌ إلغاء</button>
                </div>
            `;
        } else if (order.status === 'confirmed') {
            statusButtons = `
                <div class="status-actions">
                    <button class="btn-status btn-deliver" onclick="changeStatus(${order.id}, 'delivered')">✅ تم التوصيل</button>
                    <button class="btn-status btn-cancel" onclick="changeStatus(${order.id}, 'cancelled')">❌ إلغاء</button>
                </div>
            `;
        }

        document.getElementById('modal-body').innerHTML = `
            <div class="detail-section">
                <h3>👤 بيانات العميل</h3>
                <div class="detail-row">
                    <span class="detail-label">الاسم</span>
                    <span class="detail-value">${order.customer_name}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">الهاتف الأساسي</span>
                    <span class="detail-value phone">${order.customer_phone}</span>
                </div>
                ${order.secondary_phone ? `
                <div class="detail-row">
                    <span class="detail-label">الهاتف الاحتياطي</span>
                    <span class="detail-value phone">${order.secondary_phone}</span>
                </div>
                ` : ''}
            </div>

            <div class="detail-section">
                <h3>📍 عنوان التوصيل</h3>
                <div class="order-address">${order.shipping_address}</div>
            </div>

            <div class="detail-section">
                <h3>🛍️ المنتجات</h3>
                ${itemsHtml}
            </div>

            <div class="detail-section">
                <div class="detail-row" style="padding: 14px 0;">
                    <span class="detail-label" style="font-size: 1rem; font-weight: 600;">💰 الإجمالي</span>
                    <span class="detail-value price" style="font-size: 1.2rem;">${parseFloat(order.total_price).toLocaleString()} EGP</span>
                </div>
            </div>

            <div class="detail-section">
                <div class="detail-row">
                    <span class="detail-label">الحالة</span>
                    <span class="status-badge status-${order.status}">${statusAr[order.status] || order.status}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">تاريخ الطلب</span>
                    <span class="detail-value">${dateStr} - ${timeStr}</span>
                </div>
                ${statusButtons}
            </div>

            ${order.bot_notes ? `
            <div class="detail-section">
                <h3>🤖 ملاحظات البوت</h3>
                <div class="bot-notes">${order.bot_notes}</div>
            </div>
            ` : ''}
        `;

        document.getElementById('order-modal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('order-modal').classList.remove('active');
    }

    document.getElementById('order-modal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
    });

    // ═══ Change Status ═══
    async function changeStatus(orderId, newStatus) {
        try {
            const res = await fetch(`/api/orders/${orderId}/status/`, {
                method: 'PATCH',
                headers: {
                    'X-API-Key': API_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ status: newStatus })
            });

            if (res.ok) {
                const data = await res.json();
                // Update local data
                const order = ALL_ORDERS.find(o => o.id === orderId);
                if (order) {
                    order.status = newStatus;
                }
                renderStats();
                filterOrders();
                openModal(orderId); // Refresh modal
            }
        } catch (err) {
            console.error('Error changing status:', err);
        }
    }

    // ═══ Background Polling ═══

    // ID of the order currently open in the modal (null = closed)
    let _openModalOrderId = null;

    // Track modal open/close to avoid re-rendering while user is editing
    const _origOpenModal  = openModal;
    const _origCloseModal = closeModal;
    openModal  = function(id)  { _openModalOrderId = id;   _origOpenModal(id);  };
    closeModal = function()    { _openModalOrderId = null; _origCloseModal();   };

    // Update the "last updated" timestamp in the UI
    function _setLastUpdated() {
        const el = document.getElementById('orders-last-updated');
        if (el) el.textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar-EG');
    }

    // Silent fetch: pull fresh orders from server & merge
    async function _fetchOrders() {
        if (!API_KEY) return; // Not logged in yet
        try {
            const res = await fetch('/api/orders/dashboard/', {
                headers: { 'X-API-Key': API_KEY }
            });
            if (!res.ok) return;
            const data = await res.json();

            const newOrders = data.orders || [];

            // Detect if anything actually changed (by comparing JSON length / new IDs)
            const hadChange = (
                newOrders.length !== ALL_ORDERS.length ||
                newOrders.some(n => !ALL_ORDERS.find(o => o.id === n.id && o.status === n.status))
            );

            ALL_ORDERS = newOrders;

            if (hadChange) {
                renderStats();
                filterOrders();

                // If modal is open, refresh it with updated data
                if (_openModalOrderId !== null) {
                    _origOpenModal(_openModalOrderId);
                }
            }

            _setLastUpdated();
        } catch (e) {
            // Silent fail — network error during polling shouldn't crash the page
        }
    }

    // Start polling every 30 seconds (same interval as notifications)
    function _startOrdersPolling() {
        setInterval(_fetchOrders, 30_000);
    }

    // Kick off polling after successful login (patching login form submit)
    const _loginForm = document.getElementById('login-form');
    const _origLoginSubmit = _loginForm.onsubmit;
    // We use a flag to start polling only once after first successful auth
    let _pollingStarted = false;

    // Wrap the existing login flow to hook in polling start
    const _origLoginHandler = _loginForm._loginHandler;
    document.addEventListener('dashboardReady', () => {
        if (!_pollingStarted) {
            _pollingStarted = true;
            _startOrdersPolling();
        }
    });

    // Patch renderOrders to fire a custom event so polling starts after login
    const _origRenderOrders = renderOrders;
    renderOrders = function(orders) {
        _origRenderOrders(orders);
        if (!_pollingStarted && API_KEY) {
            _pollingStarted = true;
            _startOrdersPolling();
            _setLastUpdated();
        }
    };
</script>

</body>
</html>
