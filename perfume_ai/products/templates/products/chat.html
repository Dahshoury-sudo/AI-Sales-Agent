{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebVitas AI — شات تجريبي</title>
    <link rel="stylesheet" href="{% static 'dashboard/pages/chat.css' %}">
    {% include 'dashboard/includes/theme_head.html' %}
    <script src="{% static 'dashboard/polling.js' %}?v=requests-20261023"></script>
</head>
<body data-page="chat" data-layout="app">

    <div id="app">
        
        <!-- API Key Modal -->
        <div id="settings-modal">
            <a href="/" class="back-link" style="position: absolute; top: 20px; right: 20px;">→ الرجوع للصفحة الرئيسية</a>
            <h2>WebVitas AI </h2>
            <p>أدخل الـ API Key الخاص بالمتجر للبدء</p>
            <input type="text" id="api-key-input" placeholder="مثال: store_key_123..." autocomplete="off">
            <button class="primary-btn" onclick="startChat()">بدء المحادثة</button>
        </div>

        <!-- Chat Header -->
        <header>
            <a href="/" class="back-link" style="margin-bottom: 0; font-size: 0.8rem; flex-shrink: 0;">→ الرئيسية</a>
            <h1 style="flex: 1; text-align: center; margin: 0 10px;"><span></span> المساعد الذكي</h1>
            <button type="button" class="chat-reset" onclick="resetChat()"> محادثة جديدة</button>
        </header>

        <!-- Chat Window -->
        <div id="chat-window">
            <div class="message ai">أهلاً بك! أنا مساعدك الذكي للعطور. كيف يمكنني مساعدتك اليوم؟</div>
        </div>
        
        <div class="typing" id="typing-indicator">
            <span></span><span></span><span></span>
        </div>

        <!-- Input Area -->
        <div id="input-area">
            <input type="text" id="chat-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleEnter(event)">
            <button id="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>

    </div>

    <script>
        let apiKey = localStorage.getItem('perfume_api_key') || '';
        let conversationId = localStorage.getItem('perfume_conv_id') || null;

        const modal = document.getElementById('settings-modal');
        const inputField = document.getElementById('chat-input');
        const chatWindow = document.getElementById('chat-window');
        const typingIndicator = document.getElementById('typing-indicator');

        // Initialize
        if (apiKey) {
            modal.style.display = 'none';
        }

        function startChat() {
            const val = document.getElementById('api-key-input').value.trim();
            if (val) {
                apiKey = val;
                localStorage.setItem('perfume_api_key', apiKey);
                modal.style.opacity = '0';
                setTimeout(() => modal.style.display = 'none', 300);
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function appendMessage(sender, text, imageUrl = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            
            if (imageUrl) {
                const img = document.createElement('img');
                img.src = imageUrl;
                img.style.maxWidth = '100%';
                img.style.borderRadius = '12px';
                img.style.marginTop = '10px';
                msgDiv.appendChild(img);
            }
            
            chatWindow.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function resetChat() {
            if (sending) return;
            afterMessageId = 0;
            seenMessageIds.clear();
            localStorage.removeItem('perfume_conv_id:pending');
            conversationId = null;
            localStorage.removeItem('perfume_conv_id');
            // Clear API Key for demo purposes
            // apiKey = '';
            // localStorage.removeItem('perfume_api_key');
            // modal.style.display = 'flex';
            // modal.style.opacity = '1';
            
            // clear messages
            chatWindow.innerHTML = '<div class="message ai">أهلاً بك! أنا مساعدك الذكي للعطور. كيف يمكنني مساعدتك اليوم؟ تم بدء محادثة جديدة.</div>';
        }

        let sending = false, polling = false, afterMessageId = 0;
        const seenMessageIds = new Set();
        async function pollMessages() {
            if (!conversationId || !apiKey || !WebVitasPolling.visible() || sending || polling) return;
            polling = true;
            const token = conversationId;
            try {
                const response = await WebVitasPolling.request('chat_poll', `/api/chat/messages/?conversation_id=${encodeURIComponent(token)}&after_id=${afterMessageId}`, {headers: {'X-API-Key': apiKey}});
                if (!response.ok) return;
                const data = await response.json();
                if (token !== conversationId || sending) return;
                for (const message of data.messages) {
                    if (!seenMessageIds.has(message.id)) {
                        appendMessage(message.role === 'user' ? 'user' : 'ai', message.content, message.attachment_url);
                        seenMessageIds.add(message.id);
                    }
                }
                afterMessageId = data.after_id;
            } catch (_) { /* Retry on the next polling interval. */ }
            finally { polling = false; }
        }
        setInterval(pollMessages, 3000);
        document.addEventListener('visibilitychange', pollMessages);

        async function sendMessage() {
            if (sending) return;
            const text = inputField.value.trim();
            if (!text || !apiKey) return;

            const previous = JSON.parse(localStorage.getItem('perfume_conv_id:pending') || 'null');
            const payload = previous && previous.message === text ? previous : {message: text, client_message_id: crypto.randomUUID()};
            if (conversationId) payload.conversation_id = conversationId;
            localStorage.setItem('perfume_conv_id:pending', JSON.stringify(payload));
            if (!previous || previous.message !== text) appendMessage('user', text);
            sending = true;
            inputField.value = '';
            
            // Show typing
            chatWindow.appendChild(typingIndicator);
            typingIndicator.style.display = 'flex';
            scrollToBottom();

            try {

                const response = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-KEY': apiKey
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                typingIndicator.style.display = 'none';

                if (response.ok) {
                    localStorage.removeItem('perfume_conv_id:pending');
                    if (data.user_message_id) seenMessageIds.add(data.user_message_id);
                    if (data.message_id) seenMessageIds.add(data.message_id);
                    if (data.reply) appendMessage('ai', data.reply, data.image_url);
                    if (data.conversation_id) {
                        conversationId = data.conversation_id;
                        localStorage.setItem('perfume_conv_id', conversationId);
                    }
                } else {
                    appendMessage('ai', " خطأ: " + (data.error || "حدث خطأ غير متوقع."));
                }
            } catch (err) {
                inputField.value = text;
                typingIndicator.style.display = 'none';
                appendMessage('ai', " خطأ في الاتصال بالسيرفر.");
            } finally {
                sending = false;
            }
        }
    </script>
</body>
</html>
