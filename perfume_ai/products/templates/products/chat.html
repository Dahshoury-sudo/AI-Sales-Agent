<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Perfume Agent - Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a; /* Slate 900 */
            --glass-bg: rgba(30, 41, 59, 0.7); /* Slate 800 */
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #8b5cf6; /* Violet 500 */
            --primary-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-msg-bg: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            --ai-msg-bg: rgba(51, 65, 85, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Outfit', sans-serif;
            background: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* App Container */
        #app {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Back link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--primary); }

        /* Settings Modal (API Key) */
        #settings-modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-color);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            transition: opacity 0.3s ease;
        }
        
        #settings-modal h2 { margin-bottom: 0.5rem; font-family: 'Outfit'; }
        #settings-modal p { color: var(--text-muted); margin-bottom: 2rem; }

        input[type="text"] {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            margin-bottom: 1rem;
            font-family: inherit;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
        }

        button.primary-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            font-family: inherit;
        }

        button.primary-btn:hover { background: var(--primary-hover); }

         header {
            background: rgba(15, 23, 42, 0.8);
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0;
        }

        header h1 span {
            width: 10px; height: 10px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #10b981;
        }

        /* Chat Area */
        #chat-window {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 1rem 1.25rem;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: slideUp 0.3s ease forwards;
            white-space: pre-wrap;
        }

        .message.user {
            background: var(--user-msg-bg);
            align-self: flex-start; /* RTL: user on left/start */
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            background: var(--ai-msg-bg);
            align-self: flex-end; /* RTL: AI on right/end */
            border-bottom-left-radius: 4px;
            border: 1px solid var(--glass-border);
        }

        /* Typing Indicator */
        .typing {
            display: flex;
            gap: 0.3rem;
            padding: 1rem 1.25rem;
            background: var(--ai-msg-bg);
            border-radius: 20px;
            border-bottom-left-radius: 4px;
            align-self: flex-end;
            width: fit-content;
            display: none;
        }

        .typing span {
            width: 8px; height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }

        /* Input Area */
        #input-area {
            padding: 1.5rem;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 0.75rem;
        }

        #input-area input {
            margin-bottom: 0;
            flex: 1;
            border-radius: 50px;
            padding: 1rem 1.5rem;
        }

        #send-btn {
            background: var(--primary);
            border: none;
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        #send-btn:hover { transform: scale(1.05); }
        #send-btn svg { width: 20px; height: 20px; fill: white; transform: scaleX(-1); } /* Flip icon for RTL */

        /* Animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        @media (max-width: 768px) {
            #app {
                height: 100vh;
                border-radius: 0;
                border: none;
                max-width: 100%;
            }
            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        
        <!-- API Key Modal -->
        <div id="settings-modal">
            <a href="/" class="back-link" style="position: absolute; top: 20px; right: 20px;">→ الرجوع للصفحة الرئيسية</a>
            <h2>Perfume AI 🤖</h2>
            <p>أدخل الـ API Key الخاص بالمتجر للبدء</p>
            <input type="text" id="api-key-input" placeholder="مثال: store_key_123..." autocomplete="off">
            <button class="primary-btn" onclick="startChat()">بدء المحادثة</button>
        </div>

        <!-- Chat Header -->
        <header>
            <a href="/" class="back-link" style="margin-bottom: 0; font-size: 0.8rem; flex-shrink: 0;">→ الرئيسية</a>
            <h1 style="flex: 1; text-align: center; margin: 0 10px;"><span></span> المساعد الذكي</h1>
            <div style="font-size: 0.8rem; color: var(--text-muted); cursor: pointer; flex-shrink: 0;" onclick="resetChat()">🔄 محادثة جديدة</div>
        </header>

        <!-- Chat Window -->
        <div id="chat-window">
            <div class="message ai">أهلاً بك! أنا مساعدك الذكي للعطور. كيف يمكنني مساعدتك اليوم؟</div>
        </div>
        
        <div class="typing" id="typing-indicator">
            <span></span><span></span><span></span>
        </div>

        <!-- Input Area -->
        <div id="input-area">
            <input type="text" id="chat-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleEnter(event)">
            <button id="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>

    </div>

    <script>
        let apiKey = localStorage.getItem('perfume_api_key') || '';
        let conversationId = localStorage.getItem('perfume_conv_id') || null;

        const modal = document.getElementById('settings-modal');
        const inputField = document.getElementById('chat-input');
        const chatWindow = document.getElementById('chat-window');
        const typingIndicator = document.getElementById('typing-indicator');

        // Initialize
        if (apiKey) {
            modal.style.display = 'none';
        }

        function startChat() {
            const val = document.getElementById('api-key-input').value.trim();
            if (val) {
                apiKey = val;
                localStorage.setItem('perfume_api_key', apiKey);
                modal.style.opacity = '0';
                setTimeout(() => modal.style.display = 'none', 300);
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            chatWindow.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function resetChat() {
            conversationId = null;
            localStorage.removeItem('perfume_conv_id');
            // Clear API Key for demo purposes
            // apiKey = '';
            // localStorage.removeItem('perfume_api_key');
            // modal.style.display = 'flex';
            // modal.style.opacity = '1';
            
            // clear messages
            chatWindow.innerHTML = '<div class="message ai">أهلاً بك! أنا مساعدك الذكي للعطور. كيف يمكنني مساعدتك اليوم؟ تم بدء محادثة جديدة.</div>';
        }

        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text || !apiKey) return;

            appendMessage('user', text);
            inputField.value = '';
            
            // Show typing
            chatWindow.appendChild(typingIndicator);
            typingIndicator.style.display = 'flex';
            scrollToBottom();

            try {
                const payload = { message: text };
                if (conversationId) payload.conversation_id = conversationId;

                const response = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-KEY': apiKey
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                typingIndicator.style.display = 'none';

                if (response.ok) {
                    if (data.conversation_id) {
                        conversationId = data.conversation_id;
                        localStorage.setItem('perfume_conv_id', conversationId);
                    }
                    if (data.needs_human) {
                        appendMessage('ai', "⚠️ " + (data.info || "تم تحويل المحادثة لخدمة العملاء."));
                    } else {
                        appendMessage('ai', data.reply);
                    }
                } else {
                    appendMessage('ai', "❌ خطأ: " + (data.error || "حدث خطأ غير متوقع."));
                }
            } catch (err) {
                typingIndicator.style.display = 'none';
                appendMessage('ai', "❌ خطأ في الاتصال بالسيرفر.");
            }
        }
    </script>
</body>
</html>
