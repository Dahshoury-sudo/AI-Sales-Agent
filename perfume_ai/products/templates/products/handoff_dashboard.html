<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمة العملاء - Perfume AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-msg: rgba(59, 130, 246, 0.2);
            --bot-msg: rgba(30, 41, 59, 0.8);
            --danger: #ef4444;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Sidebar */
        .sidebar {
            width: 350px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-left: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--glass-border);
            text-align: center;
        }
        
        .sidebar-header h2 {
            margin: 0;
            font-size: 1.5rem;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .conv-item {
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .conv-item:hover, .conv-item.active {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--primary);
        }

        .conv-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .conv-preview {
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Main Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(15, 23, 42, 0.5);
        }

        .chat-header {
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-resolve {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.3s;
            display: none;
        }

        .btn-resolve:hover {
            background: var(--primary-hover);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 12px;
            line-height: 1.5;
            position: relative;
        }

        .message.user {
            align-self: flex-start;
            background: var(--user-msg);
            border: 1px solid var(--primary);
            border-bottom-right-radius: 0;
        }

        .message.assistant {
            align-self: flex-end;
            background: var(--bot-msg);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 0;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 5px;
            text-align: left;
        }

        .chat-input-area {
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input-area input:focus {
            border-color: var(--primary);
        }

        .btn-send {
            background: var(--primary);
            color: white;
            border: none;
            width: 50px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-send:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .no-selection {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: var(--text-muted);
            gap: 15px;
        }

        .no-selection i {
            font-size: 4rem;
            opacity: 0.5;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        
        .badge {
            background: var(--danger);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-headset"></i> خدمة العملاء</h2>
            </div>
            <div class="conversations-list" id="conv-list">
                <!-- Conversations will be injected here -->
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-area" id="chat-area" style="display: none;">
            <div class="chat-header">
                <h3>محادثة رقم #<span id="current-conv-id"></span></h3>
                <button class="btn-resolve" id="btn-resolve" onclick="resolveConversation()">
                    <i class="fas fa-check"></i> إنهاء المحادثة (Resolved)
                </button>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                <!-- Messages will be injected here -->
            </div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="اكتب ردك للعميل هنا..." onkeypress="handleKeyPress(event)">
                <button class="btn-send" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <div class="no-selection" id="no-selection">
            <i class="fas fa-comments"></i>
            <h2>اختر محادثة للبدء في الرد</h2>
        </div>
    </div>

    <script>
        // Use prompt to get Store API Key just for the demo/dashboard admin access
        const STORE_API_KEY = localStorage.getItem('store_api_key') || prompt("Enter Store API Key:");
        localStorage.setItem('store_api_key', STORE_API_KEY);

        let activeConversationId = null;
        let lastMessageCount = 0;

        function formatDate(isoString) {
            const d = new Date(isoString);
            return d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        }

        async function fetchConversations() {
            try {
                const res = await fetch('/api/handoff/conversations/', {
                    headers: { 'X-API-Key': STORE_API_KEY }
                });
                if(!res.ok) return;
                const data = await res.json();
                
                const list = document.getElementById('conv-list');
                list.innerHTML = '';
                
                if (data.conversations.length === 0) {
                    list.innerHTML = '<div style="text-align:center; color: #94a3b8; margin-top:20px;">لا توجد محادثات معلقة حالياً 🎉</div>';
                }

                data.conversations.forEach(conv => {
                    const div = document.createElement('div');
                    div.className = `conv-item ${activeConversationId === conv.id ? 'active' : ''}`;
                    div.onclick = () => openConversation(conv.id);
                    
                    div.innerHTML = `
                        <div class="conv-header">
                            <span>عميل #${conv.id} <span class="badge">عاجل</span></span>
                            <span>${formatDate(conv.created_at)}</span>
                        </div>
                        <div class="conv-preview">${conv.last_message}</div>
                    `;
                    list.appendChild(div);
                });
            } catch(e) {
                console.error("Error fetching conversations", e);
            }
        }

        async function openConversation(id) {
            activeConversationId = id;
            document.getElementById('no-selection').style.display = 'none';
            document.getElementById('chat-area').style.display = 'flex';
            document.getElementById('current-conv-id').textContent = id;
            document.getElementById('btn-resolve').style.display = 'block';
            
            // Highlight sidebar
            fetchConversations();
            
            // Fetch messages immediately
            lastMessageCount = 0;
            await fetchMessages();
        }

        async function fetchMessages() {
            if (!activeConversationId) return;
            
            try {
                const res = await fetch(`/api/handoff/conversations/${activeConversationId}/messages/`, {
                    headers: { 'X-API-Key': STORE_API_KEY }
                });
                if(!res.ok) return;
                const data = await res.json();
                
                // Only update DOM if new messages arrived
                if (data.messages.length > lastMessageCount) {
                    const msgContainer = document.getElementById('chat-messages');
                    msgContainer.innerHTML = '';
                    
                    data.messages.forEach(msg => {
                        const div = document.createElement('div');
                        div.className = `message ${msg.role}`;
                        // Add line breaks
                        const formattedContent = msg.content.replace(/\\n/g, '<br>');
                        div.innerHTML = `
                            <div>${formattedContent}</div>
                            <div class="message-time">${formatDate(msg.created_at)}</div>
                        `;
                        msgContainer.appendChild(div);
                    });
                    
                    msgContainer.scrollTop = msgContainer.scrollHeight;
                    lastMessageCount = data.messages.length;
                }
            } catch(e) {
                console.error("Error fetching messages", e);
            }
        }

        async function sendMessage() {
            if (!activeConversationId) return;
            
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            
            // Optimistically add message
            const msgContainer = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `message assistant`;
            div.innerHTML = `
                <div>${text}</div>
                <div class="message-time">الآن (أنت)</div>
            `;
            msgContainer.appendChild(div);
            msgContainer.scrollTop = msgContainer.scrollHeight;
            lastMessageCount++; // To avoid flicker

            try {
                await fetch(`/api/handoff/conversations/${activeConversationId}/reply/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': STORE_API_KEY
                    },
                    body: JSON.stringify({ message: text })
                });
                
                fetchMessages();
            } catch(e) {
                console.error("Error sending message", e);
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        async function resolveConversation() {
            if (!activeConversationId) return;
            
            if(!confirm("هل أنت متأكد من حل هذه المشكلة وإغلاق المحادثة؟")) return;

            try {
                await fetch(`/api/handoff/conversations/${activeConversationId}/resolve/`, {
                    method: 'POST',
                    headers: { 'X-API-Key': STORE_API_KEY }
                });
                
                activeConversationId = null;
                document.getElementById('no-selection').style.display = 'flex';
                document.getElementById('chat-area').style.display = 'none';
                
                fetchConversations();
            } catch(e) {
                console.error("Error resolving conversation", e);
            }
        }

        // Poll every 3 seconds
        setInterval(() => {
            fetchConversations();
            fetchMessages();
        }, 3000);

        // Initial load
        fetchConversations();
    </script>
</body>
</html>
