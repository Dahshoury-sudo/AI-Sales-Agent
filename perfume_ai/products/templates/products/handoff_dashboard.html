<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمة العملاء - Perfume AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-msg: rgba(59, 130, 246, 0.2);
            --bot-msg: rgba(30, 41, 59, 0.8);
            --danger: #ef4444;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Sidebar */
        .sidebar {
            width: 350px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-left: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--glass-border);
            text-align: center;
        }
        
        .sidebar-header h2 {
            margin: 0;
            font-size: 1.5rem;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .conv-item {
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .conv-item:hover, .conv-item.active {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--primary);
        }

        .conv-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .conv-preview {
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Main Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(15, 23, 42, 0.5);
        }

        .chat-header {
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-resolve {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.3s;
            display: none;
        }

        .btn-resolve:hover {
            background: var(--primary-hover);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 12px;
            line-height: 1.5;
            position: relative;
        }

        .message.user {
            align-self: flex-end;
            background: var(--bot-msg);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 0;
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--user-msg);
            border: 1px solid var(--primary);
            border-bottom-right-radius: 0;
        }

        /* A human colleague's reply, sent from this dashboard. Saved with role="agent"
           rather than "assistant" so the bot never reads it back as its own voice —
           which means it needs its own bubble here, or it renders unstyled. */
        .message.agent {
            align-self: flex-start;
            background: var(--user-msg);
            border: 1px dashed var(--primary);
            border-bottom-right-radius: 0;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 5px;
            text-align: left;
        }

        .chat-input-area {
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input-area input:focus {
            border-color: var(--primary);
        }

        .btn-send {
            background: var(--primary);
            color: white;
            border: none;
            width: 50px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-send:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .no-selection {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: var(--text-muted);
            gap: 15px;
        }

        .no-selection i {
            font-size: 4rem;
            opacity: 0.5;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        
        .badge {
            background: var(--danger);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .platform-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .platform-badge.whatsapp {
            background: rgba(37, 211, 102, 0.15);
            color: #25d366;
            border: 1px solid rgba(37, 211, 102, 0.3);
        }

        .platform-badge.messenger {
            background: rgba(0, 132, 255, 0.15);
            color: #0084ff;
            border: 1px solid rgba(0, 132, 255, 0.3);
        }

        .platform-badge.instagram {
            background: rgba(225, 48, 108, 0.15);
            color: #e1306c;
            border: 1px solid rgba(225, 48, 108, 0.3);
        }

        .platform-badge.web {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        @media (max-width: 1366px) {
            .sidebar { width: 300px; }
        }

        @media (max-width: 1024px) {
            .sidebar { width: 280px; }
            .chat-header-info { gap: 8px; }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 35%;
                border-left: none;
                border-bottom: 1px solid var(--glass-border);
            }
            .chat-area {
                height: 65%;
            }
            .chat-header {
                padding: 12px;
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .btn-resolve {
                width: 100%;
            }
            .message {
                max-width: 90%;
            }
            .chat-input-area {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-headset"></i> خدمة العملاء</h2>
            </div>
            <div class="conversations-list" id="conv-list">
                <!-- Conversations will be injected here -->
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-area" id="chat-area" style="display: none;">
            <div class="chat-header">
                <div class="chat-header-info">
                    <h3>محادثة رقم #<span id="current-conv-id"></span></h3>
                    <span id="current-platform-badge"></span>
                    <span id="current-sender-info" style="font-size:0.85rem; color:var(--text-muted); background:rgba(255,255,255,0.05); padding:4px 10px; border-radius:20px; border:1px solid var(--glass-border);"></span>
                </div>
                <button class="btn-resolve" id="btn-resolve" onclick="resolveConversation()">
                    <i class="fas fa-check"></i> إنهاء المحادثة (Resolved)
                </button>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                <!-- Messages will be injected here -->
            </div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="اكتب ردك للعميل هنا..." onkeypress="handleKeyPress(event)">
                <button class="btn-send" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <div class="no-selection" id="no-selection">
            <i class="fas fa-comments"></i>
            <h2>اختر محادثة للبدء في الرد</h2>
        </div>
    </div>

    <script>
        // Use JWT token from dashboard localStorage (no API key needed)
        const ACCESS_TOKEN = localStorage.getItem('access_token');

        let activeConversationId = null;
        let activeConversationPlatform = null;
        let lastConversationsJSON = "";
        let lastMessagesJSON = "";

        const platformConfig = {
            whatsapp:  { icon: 'fab fa-whatsapp',       label: 'واتساب',    css: 'whatsapp' },
            messenger: { icon: 'fab fa-facebook-messenger', label: 'ماسنجر', css: 'messenger' },
            instagram: { icon: 'fab fa-instagram',       label: 'انستجرام',  css: 'instagram' },
            web:       { icon: 'fas fa-globe',           label: 'ويب',       css: 'web' },
        };

        function getPlatformBadgeHTML(platform) {
            const cfg = platformConfig[platform] || platformConfig.web;
            return `<span class="platform-badge ${cfg.css}"><i class="${cfg.icon}"></i> ${cfg.label}</span>`;
        }

        function formatDate(isoString) {
            const d = new Date(isoString);
            return d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        }

        async function fetchConversations() {
            try {
                const res = await fetch('/api/handoff/conversations/', {
                    headers: { 'Authorization': `Bearer ${ACCESS_TOKEN}` }
                });
                if(!res.ok) return;
                const data = await res.json();
                
                const currentJSON = JSON.stringify(data.conversations);
                if (currentJSON === lastConversationsJSON) return;
                lastConversationsJSON = currentJSON;
                
                const list = document.getElementById('conv-list');
                list.innerHTML = '';
                
                if (data.conversations.length === 0) {
                    list.innerHTML = '<div style="text-align:center; color: #94a3b8; margin-top:20px;">لا توجد محادثات معلقة حالياً 🎉</div>';
                }

                data.conversations.forEach(conv => {
                    const div = document.createElement('div');
                    div.className = `conv-item ${activeConversationId === conv.id ? 'active' : ''}`;
                    // Update active item immediately on click without waiting for fetch
                    div.onclick = () => {
                        document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
                        div.classList.add('active');
                        openConversation(conv.id, conv.platform, conv.platform_sender_id);
                    };

                    const senderLine = conv.platform_sender_id
                        ? `<div style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">${buildSenderInfo(conv.platform, conv.platform_sender_id)}</div>`
                        : '';
                    
                    div.innerHTML = `
                        <div class="conv-header">
                            <span>عميل #${conv.id} ${getPlatformBadgeHTML(conv.platform)}</span>
                            <span>${formatDate(conv.created_at)}</span>
                        </div>
                        ${senderLine}
                        <div class="conv-preview">${conv.last_message}</div>
                    `;
                    list.appendChild(div);
                });
            } catch(e) {
                console.error("Error fetching conversations", e);
            }
        }

        function formatWhatsAppNumber(phone) {
            const digits = phone.replace(/\D/g, '');
            // Egyptian numbers: 20 + 10-digit local (e.g. 201234567890 → 01234567890)
            if (digits.startsWith('20') && digits.length === 12) {
                return '0' + digits.slice(2);
            }
            // Already local format
            if (digits.startsWith('0')) return digits;
            // Generic: strip country code, keep last 10 digits and prepend 0
            if (digits.length > 10) {
                return '0' + digits.slice(-10);
            }
            return digits;
        }

        function buildSenderInfo(platform, senderId) {
            if (!senderId) return '';
            if (platform === 'whatsapp')  return `📞 ${formatWhatsAppNumber(senderId)}`;
            if (platform === 'instagram') return `📸 @${senderId}`;
            if (platform === 'messenger') return `💬 fb: ${senderId}`;
            return `🔗 ${senderId}`;
        }

        async function openConversation(id, platform, senderInfo) {
            if (activeConversationId === id) return; // Ignore clicking the same chat
            activeConversationId = id;
            activeConversationPlatform = platform;
            document.getElementById('no-selection').style.display = 'none';
            document.getElementById('chat-area').style.display = 'flex';
            document.getElementById('current-conv-id').textContent = id;
            document.getElementById('current-platform-badge').innerHTML = getPlatformBadgeHTML(platform);
            const senderEl = document.getElementById('current-sender-info');
            senderEl.textContent = buildSenderInfo(platform, senderInfo);
            senderEl.style.display = senderInfo ? 'inline-block' : 'none';
            document.getElementById('btn-resolve').style.display = 'block';
            
            // Clear messages instantly and show loading state
            const msgContainer = document.getElementById('chat-messages');
            msgContainer.innerHTML = '<div style="text-align:center; color: #94a3b8; margin-top:20px;">جاري تحميل المحادثة... <i class="fas fa-circle-notch fa-spin"></i></div>';
            
            // Reset JSON cache to force re-render
            lastMessagesJSON = "";
            await fetchMessages();
        }

        async function fetchMessages() {
            if (!activeConversationId) return;
            
            try {
                const res = await fetch(`/api/handoff/conversations/${activeConversationId}/messages/`, {
                    headers: { 'Authorization': `Bearer ${ACCESS_TOKEN}` }
                });
                if(!res.ok) return;
                const data = await res.json();
                
                const currentJSON = JSON.stringify(data.messages);
                if (currentJSON === lastMessagesJSON) return;
                lastMessagesJSON = currentJSON;
                
                const msgContainer = document.getElementById('chat-messages');
                msgContainer.innerHTML = '';
                
                if (data.messages.length === 0) {
                    msgContainer.innerHTML = '<div style="text-align:center; color: #94a3b8; margin-top:20px;">لا توجد رسائل سابقة.</div>';
                }

                data.messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = `message ${msg.role}`;
                    // Add line breaks
                    const formattedContent = msg.content ? msg.content.replace(/\\n/g, '<br>') : '';
                    div.innerHTML = `
                        <div>${formattedContent}</div>
                        <div class="message-time">${formatDate(msg.created_at)}</div>
                    `;
                    msgContainer.appendChild(div);
                });
                
                msgContainer.scrollTop = msgContainer.scrollHeight;
                
            } catch(e) {
                console.error("Error fetching messages", e);
            }
        }

        async function sendMessage() {
            if (!activeConversationId) return;
            
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            
            // Optimistically add message
            const msgContainer = document.getElementById('chat-messages');
            
            // If it was empty, clear the "no messages" text
            if (msgContainer.innerHTML.includes('لا توجد رسائل سابقة')) {
                msgContainer.innerHTML = '';
            }
            
            const div = document.createElement('div');
            // "agent", matching the role the reply endpoint saves it under — otherwise
            // the bubble restyles itself a second later when fetchMessages() reruns.
            div.className = `message agent`;
            div.innerHTML = `
                <div>${text.replace(/\\n/g, '<br>')}</div>
                <div class="message-time">الآن (أنت)</div>
            `;
            msgContainer.appendChild(div);
            msgContainer.scrollTop = msgContainer.scrollHeight;

            try {
                await fetch(`/api/handoff/conversations/${activeConversationId}/reply/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${ACCESS_TOKEN}`
                    },
                    body: JSON.stringify({ message: text })
                });
                
                // Reset JSON cache to force update on next fetch
                lastMessagesJSON = "";
                fetchMessages();
            } catch(e) {
                console.error("Error sending message", e);
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        async function resolveConversation() {
            if (!activeConversationId) return;
            
            if(!confirm("هل أنت متأكد من حل هذه المشكلة وإغلاق المحادثة؟")) return;

            try {
                await fetch(`/api/handoff/conversations/${activeConversationId}/resolve/`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${ACCESS_TOKEN}` }
                });
                
                activeConversationId = null;
                document.getElementById('no-selection').style.display = 'flex';
                document.getElementById('chat-area').style.display = 'none';
                
                // Force update on conversations
                lastConversationsJSON = "";
                fetchConversations();
            } catch(e) {
                console.error("Error resolving conversation", e);
            }
        }

        // Poll every 10 seconds to avoid hitting rate limits (429)
        setInterval(() => {
            fetchConversations();
            fetchMessages();
        }, 10000);

        // Initial load
        fetchConversations();
    </script>
</body>
</html>
