{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمة العملاء - WebVitas AI</title>
    <link rel="stylesheet" href="{% static 'dashboard/pages/handoff_dashboard.css' %}?v=requests-20261023">
    {% include 'dashboard/includes/theme_head.html' %}
    {% include 'dashboard/includes/requests.html' %}
</head>
<body data-page="handoff_dashboard" data-layout="app">

    <main class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-headset"></i> خدمة العملاء</h2>
            </div>
            <div class="conversations-list" id="conv-list">
                <!-- Conversations will be injected here -->
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-area" id="chat-area" style="display: none;">
            <div class="chat-header">
                <button type="button" class="conversation-back" aria-label="العودة إلى المحادثات">→ المحادثات</button>
                <div class="chat-header-info">
                    <h3>محادثة رقم #<span id="current-conv-id"></span></h3>
                    <span id="current-platform-badge"></span>
                    <span id="current-sender-info" style="font-size:0.85rem; color:var(--text-muted); background:var(--surface); padding:4px 10px; border-radius:20px; border:1px solid var(--glass-border);"></span>
                </div>
                <button class="btn-resolve" id="btn-resolve" onclick="resolveConversation()">
                    <i class="fas fa-check"></i> إنهاء المحادثة (Resolved)
                </button>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                <!-- Messages will be injected here -->
            </div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="اكتب ردك للعميل هنا..." onkeypress="handleKeyPress(event)">
                <button class="btn-send" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <div class="no-selection" id="no-selection">
            <i class="fas fa-comments"></i>
            <h2>اختر محادثة للبدء في الرد</h2>
        </div>
    </main>

    <script src="{% static 'dashboard/notifications.js' %}?v=requests-20261023"></script>
    <script src="{% static 'dashboard/handoff.js' %}?v=requests-20261023"
            data-sound-url="{% static 'dashboard/sounds/skyline.mp3' %}"></script>
</body>
</html>
